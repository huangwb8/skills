# auto-test-project 配置文件
# 用于配置项目级测试驱动优化工作流的参数（尽量避免在 SKILL.md 中硬编码）
#
# 注意：
# - `scripts/create_test_session.py` 会读取 `directories.*` 与 `templates.*`（并做基础路径安全校验：拒绝绝对路径/越界与模板 symlink 逃逸）。
# - `scripts/verify_test_session.py` 会读取 `directories.*` 与 `verification.*` 作为默认口径（CLI 仍可覆盖）。
# - 其余字段主要用于 AI/人类在 A/B 轮规划时复用默认参数与检查维度，并作为文档的“单一口径”来源。

# ============================================================================
# Skill 信息
# ============================================================================

skill_info:
  name: "auto-test-project"
  version: "1.3.0"
  description: "项目级自动化测试驱动优化技能 - 支持多轮A轮迭代与B轮质量检查（维度以 b_round_check.dimensions 为准）+ A轮独立评估 + 批判性思维门槛（P0+P1占比/系统性问题）+ 强制验证机制 + 模板自动替换 + 强制数量要求"
  category: "normal"

# ============================================================================
# 目录与命名规范
# ============================================================================

directories:
  # 规划文档目录（相对于项目根目录）
  plans: "plans"
  # 测试目录（相对于项目根目录）
  tests: "tests"

# ============================================================================
# 项目识别
# ============================================================================

project_detection:
  # 项目指令文件候选列表（按优先级排序）
  instruction_files:
    - "CLAUDE.md"
    - "AGENTS.md"
    - "PROJECT.md"
    - "README.md"
  # 项目配置文件候选列表
  config_files:
    - "config.yaml"
    - "package.json"
    - "pyproject.toml"
    - "Cargo.toml"
    - "go.mod"
    - "pom.xml"
    - "build.gradle"
  # 项目类型识别标志
  type_markers:
    skill:
      - "SKILL.md"
      - ".claude/skills/"
    workflow:
      - "workflows/"
      - ".github/workflows/"
    script_collection:
      - "bin/"
      - "scripts/"
    documentation:
      - "docs/"
      - "mkdocs.yml"
      - "docusaurus.config.js"

# ============================================================================
# 轮次控制
# ============================================================================

test_rounds:
  # A轮测试默认轮次
  default_a_rounds: 1
  # 最大A轮测试轮次（防止无限循环）
  max_a_rounds: 10
  # A轮每轮最少问题数量（P0+P1+P2，总和）
  min_issues_per_round: 10
  # 项目级建议目标范围（考虑跨模块复杂性）
  target_issues_range: [15, 25]
  # A轮 P0+P1 最小占比（百分比）- 确保问题有价值
  min_p0_p1_ratio: 60
  # A轮系统性问题最小数量（架构/过度设计/一致/安全等）
  min_systemic_issues: 3

# ============================================================================
# A轮审查范围（独立评估；规划口径）
# ============================================================================

a_round_check:
  independent_review:
    # 是否启用独立评估模式（A轮不看历史 plans/ 与 tests/，避免确认偏差/路径依赖）
    enabled: true
    # 排除的历史/产物路径（Glob）
    exclude_patterns:
      - "tests/**"
      - "plans/**"
      - "**/.git/**"
      - "**/node_modules/**"
      - "**/__pycache__/**"
      - "**/_artifacts/**"
      - "**/*.bak"

# ============================================================================
# B轮质量检查（项目级质量原则检查；维度以 b_round_check.dimensions 为准）
# ============================================================================

b_round_check:
  # B轮是否为强制环节（默认true，除非用户明确跳过）
  mandatory: true
  # B轮必须提出的最小建议数量（P0 + P1 + P2 总和）
  min_suggestions: 10
  # 建议数量目标范围
  target_suggestions_range: [10, 20]
  # P0/P1 修复率要求（百分比，作为质量门槛）
  p0_fix_rate_required: 100
  p1_fix_rate_required: 80
  dimensions:
    - name: "hardcoded_ai_plan"
      label: "硬编码/AI功能规划"
      description: "检查确定性操作是否应硬编码，启发式判断是否由AI处理"
      project_level: true
      scope: "跨模块分析：识别可脚本化的重复操作"
    - name: "redundancy_check"
      label: "冗余残留错误检查"
      description: "检查是否存在重复逻辑、残留引用、僵尸文件"
      project_level: true
      scope: "跨文件检查：模块间的重复逻辑、全局的残留引用"
    - name: "security_check"
      label: "安全性检查"
      description: "检查输入验证、路径处理、敏感信息、权限控制"
      project_level: true
      scope: "项目级安全：外部接口、依赖安全性、配置文件安全"
    - name: "overdesign_check"
      label: "过度设计检查"
      description: "检查是否存在YAGNI违反、不必要的抽象、配置臃肿"
      project_level: true
      scope: "架构级检查：模块边界、抽象层次、配置复杂度"
    - name: "generality_check"
      label: "通用性检查"
      description: "检查是否包含不必要的年份/场景限制/平台依赖等"
      project_level: true
      scope: "跨平台检查：项目是否过度依赖特定平台或场景"
    - name: "consistency_check"
      label: "一致性检查"
      description: "检查项目指令文件、配置、文档与代码的一致性"
      project_level: true
      scope: "全局一致性：模块间接口、命名规范、文档同步"
    - name: "project_instruction_weight_check"
      label: "项目指令文件瘦身检查"
      description: "检查项目指令文件（CLAUDE.md等）是否过于冗长，应将详细内容模块化"
      project_level: true
      scope: "项目级文档瘦身：核心原则保留，详细内容下沉到模块"
    - name: "config_centralization_check"
      label: "配置集中化检查"
      description: "检查可配置参数是否集中到配置文件作为单一真相来源，避免散落在文档/脚本/示例中造成口径不一致"
      project_level: true
      scope: "项目级配置治理：精确端（配置）与模糊端（文档/Prompt）分离，避免重复与漂移"

# ============================================================================
# 测试会话配置
# ============================================================================

test_session:
  # 时间戳格式
  timestamp_format: "%Y%m%d%H%M"
  # 最大迭代轮数(默认10轮,防止无限循环)
  max_iterations: 10

# ============================================================================
# 问题优先级配置
# ============================================================================

priority:
  # 优先级定义
  levels:
    P0:
      name: "Critical"
      description: "阻塞性问题,完全无法使用"
      response_time: "立即"
      color: "red"
      examples:
        - "项目完全无法初始化"
        - "核心功能完全失效"
        - "数据丢失或损坏"
        - "严重安全漏洞"
    P1:
      name: "High"
      description: "严重问题,核心功能受影响"
      response_time: "24小时内"
      color: "orange"
      examples:
        - "主要功能失效"
        - "性能严重退化"
        - "跨模块兼容性问题"
        - "用户体验严重受损"
    P2:
      name: "Medium"
      description: "中等问题,部分功能受限"
      response_time: "3天内"
      color: "yellow"
      examples:
        - "边缘功能失效"
        - "性能轻微退化"
        - "文档不一致"
        - "配置文件问题"
    P3:
      name: "Low"
      description: "轻微问题,不影响主要功能"
      response_time: "1周内"
      color: "green"
      examples:
        - "文档错误"
        - "UI瑕疵"
        - "代码风格问题"
        - "体验优化建议"

# ============================================================================
# 文档模板配置
# ============================================================================

templates:
  # Bug报告模板
  bug_report: "templates/BUG_REPORT_TEMPLATE.md"
  # 优化计划模板
  optimization_plan: "templates/OPTIMIZATION_PLAN_TEMPLATE.md"
  # 测试计划模板
  test_plan: "templates/TEST_PLAN_TEMPLATE.md"
  # 测试报告模板
  test_report: "templates/TEST_REPORT_TEMPLATE.md"
  # 最终总结模板
  final_summary: "templates/FINAL_SUMMARY_TEMPLATE.md"
  # B轮质量检查模板
  b_round_check: "templates/B_ROUND_CHECK_TEMPLATE.md"
  # 项目类型分析模板
  project_type_analysis: "templates/PROJECT_TYPE_ANALYSIS_TEMPLATE.md"

# ============================================================================
# 验证脚本默认值（scripts/verify_test_session.py）
# ============================================================================

verification:
  # TEST_REPORT.md 的最小长度（字符数，扣除占位文本后）
  min_report_length: 500
  # plans/<session_name>.md 中最少的问题编号数量（形如 "#### P0-1:"）
  min_issue_count: 10
  # 是否默认要求计划文档存在并可执行一致性检查（脚本可通过 --require-plan 开启）
  require_plan_default: false

# ============================================================================
# 项目级测试边界配置
# ============================================================================

project_testing:
  # 核心模块识别（通过目录/文件模式）
  core_modules:
    - pattern: "src/"
      priority: "critical"
    - pattern: "lib/"
      priority: "high"
    - pattern: "scripts/"
      priority: "high"
    - pattern: "SKILL.md"
      priority: "critical"
    - pattern: "CLAUDE.md"
      priority: "critical"
  # 跨模块测试配置
  cross_module_testing:
    enabled: true
    # 需要集成测试的模块组合
    integration_pairs:
      - ["src/", "lib/"]
      - ["scripts/", "config.yaml"]
  # 排除的测试路径
  exclude_paths:
    - "node_modules/"
    - "__pycache__/"
    - ".git/"
    - "tests/"
    - "plans/"
    - "_artifacts/"
