[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bensz-skill-identity"
version = "1.0.2"
description = "Bensz Skill Identity (BSI): signed releases, explicit trust and exact dependency locks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Bensz Conan"}]
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6.0,<7", "cryptography>=43"]

[project.urls]
Repository = "https://github.com/huangwb8/skills"
Documentation = "https://github.com/huangwb8/skills/blob/main/packages/bensz-skill-identity/README.md"
Changelog = "https://github.com/huangwb8/skills/blob/main/packages/bensz-skill-identity/CHANGELOG.md"

[project.scripts]
bsi = "bensz_skill_identity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "../../.bensz-api/.pytest_cache"

[tool.ruff]
cache-dir = "../../.bensz-api/.ruff_cache"
