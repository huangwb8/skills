[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bensz-skill-kernel"
version = "0.12.2"
description = "Append-only lifecycle runtime for Bensz Agent Skills"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
bsk = "bensz_skill_kernel.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bensz_skill_kernel*"]

[tool.setuptools.package-data]
bensz_skill_kernel = ["states/*", "states/**/*", "verifiers/*", "verifiers/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
