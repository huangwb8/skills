skill_info:
  name: parallel-vibe
  version: 0.4.1
  description: '当用户明确要求"并行执行同一条 Vibe Coding 指令 / 多个独立 agent 或 subagent 同时审查、想方案、优化、对比多条路线 / 多线程独立尝试"时使用。默认使用智能模式：由宿主原生 subagent 独立分析并由主 agent 汇总；智能模式和代码模式必须使用同一套 `.parallel_vibe/<project_id>/` 目录、`@main/plan.json`、thread `workspace/`、`RESULT.md` 与 `runner.log` 契约，区别只在底层执行机制；当用户要求脚本 runner、plan-file、resume、跨 CLI runner、退出码或无可用 subagent 时，切换到代码模式并调用 `scripts/parallel_vibe.py`。⚠️ 不适用：普通 shell 并发、单元测试并发、下载任务、要求强安全隔离或处理高度敏感数据。'
  author: "Bensz Conan"
  category: "workflow"

defaults:
  mode: "smart"  # smart|code（默认智能模式；两种模式共享 .parallel_vibe 目录契约）
  n_threads: 5
  thread_id_width: 3
  execution: "serial"  # serial|parallel（默认串行，避免资源争抢与 API 限流）
  max_parallel: 3  # 仅当 execution=parallel 或 CLI --parallel 时生效
  synthesize: true  # 是否在 threads 结束后再跑一次 synth 汇总（会额外调用一次 runner）
  symlink_policy: "error"  # error|skip|keep（默认拒绝 symlink；避免击穿工作区边界假设）
  copy_exclude:
    - ".parallel_vibe"
    - ".git"
    - "node_modules"
    - "__pycache__"
    - ".DS_Store"
    - "Thumbs.db"
    - ".venv"
    - "venv"
    - ".pytest_cache"
    - ".mypy_cache"
    - ".ruff_cache"
    - ".cache"
    - ".tox"
    - ".coverage"
    - "dist"
    - "build"
    - "target"

modes:
  smart:
    name: "智能模式"
    default: true
    description: "使用宿主原生 subagent / 独立上下文能力，多 thread 独立分析后由主 agent 汇总；目录、plan、thread workspace、RESULT.md 与 runner.log 契约和代码模式一致。"
  code:
    name: "代码模式"
    default: false
    description: "调用 scripts/parallel_vibe.py，用 CLI runner 在同一套 .parallel_vibe 目录契约内执行，提供 plan-file、resume、退出码和跨 runner 批处理能力。"

cli:
  codex:
    cmd: ["codex"]
    # 这些参数是“全局参数”（放在子命令 exec 之前）。
    # 目标：避免子进程等待人工确认而卡住；并把模型生成的 shell 执行约束在 workspace-write。
    # 如果你的 codex CLI 版本不支持这些参数，请清空该列表。
    global_args: ["--ask-for-approval", "never", "--sandbox", "workspace-write"]
    exec_subcommand: ["exec"]
    # 这些参数是“子命令参数”（放在 exec 之后、prompt 之前）。
    subcommand_args: []
    model_flag: "-m"  # 常见：-m / --model（以你本机 codex CLI 为准）
    # profile -> 追加到 global_args 的参数（用于把“任务强度”落到可执行命令）
    profile_args:
      default: []
      fast: ["-c", 'reasoning_effort="low"']
      deep: ["-c", 'reasoning_effort="medium"']
  claude:
    cmd: ["claude"]
    # --dangerously-skip-permissions: 绕过工具调用权限确认，防止 -p 模式下 thread 阻塞
    # --no-session-persistence: 不把 thread 运行写入会话历史，避免污染（仅在 --print 模式下生效）
    global_args: ["--dangerously-skip-permissions", "--no-session-persistence"]
    print_subcommand: ["-p"]
    subcommand_args: []
    model_flag: "--model"
    profile_args:
      default: []
      fast: ["--effort", "low"]
      deep: ["--effort", "medium"]

models:
  # 为空表示“使用 CLI 默认模型”（推荐先保持为空，确认本机可用模型后再填）
  codex:
    default: ""
    fast: ""
    deep: ""
  claude:
    default: ""
    fast: ""
    deep: ""
