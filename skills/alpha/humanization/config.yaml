skill_info:
  name: humanization
  version: 1.3.1
  description: "去除 NSFC 标书中的 AI 机器味，覆盖词语、句法、段落和章节层，处理定义后连续否定排除项，并保护 LaTeX、数字、代码状态与安全不变量（不适用：非标书内容/需修改格式/需补充新内容）"
  category: writing

defaults:
  section_type: 通用
  field: general
  strength: aggressive
  output_mode: text_only
  self_eval_rounds: 1
  max_self_eval_rounds: 2

section_roles:
  立项依据: 问题驱动，明确研究缺口
  研究内容: 说明研究动作、边界、步骤和验证口径
  研究基础: 按证据链写清已有结果与局限
  工作条件: 将资源逐项对位到研究任务
  风险应对: 说明风险、触发条件、影响和备选方案
  通用: 只按原文职责判断，不强行套用其他章节结构
  其他: 先确认章节职责，再决定保留或合并内容

quality_checks:
  diagnostic_layers: [词语层, 句法层, 段落层, 章节层]
  require_term_table: true
  require_invariant_audit: true
  require_protected_token_diff: true
  require_boundary_disposition_table: true
