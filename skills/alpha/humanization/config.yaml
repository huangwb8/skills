skill_info:
  name: humanization
  version: 1.5.0
  description: "润色和优化已有文字，让表达自然、清楚、连贯。适用于文章、邮件、报告、说明、学术与技术文本的语言润色、去机器味、调整语气或改善句段衔接；不用于从零写作、补充事实、事实核查、纯翻译、版式修改或全局对话风格设置。"
  category: writing

defaults:
  section_type: 通用
  field: general
  strength: moderate
  output_mode: text_only
  self_eval_rounds: 2
  max_self_eval_rounds: 2
  style_profile: auto
  structure_mode: preserve

parameters:
  field: [general, cs, engineering, medicine, life_science]
  strength: [minimal, moderate, aggressive]
  output_mode: [text_only, text_with_change_summary, diagnosis_only, text_with_change_summary_and_style_card]
  self_eval_rounds: [1, 2]
  structure_mode: [preserve, reflow_plain]

# auto 按用户用途/读者/语气和原文选择；线索不足时使用 general_prose。
# 普通问答不触发；已有文本的润色无需点名 Skill 或显式选择 profile。
style_profiles:
  auto: 遵循用户要求，依据原文适配语言与语域；默认保留作者意图和正式程度
  general_prose: 自然、清楚、连贯；适合文章、报告和一般文字，保留原有个性
  academic_general: 准确、克制、论证清楚；保留术语、证据强度和研究边界
  natural_explanation: 清晰、亲切、循序解释；使用原文支持的原因和例子
  technical_prose: 精确、直接；保留真实步骤、接口和必要列表，解释已有技术关系
  professional_communication: 得体、直接、便于回应；保留关系、请求力度、承诺和责任边界
  nsfc_academic: 兼容旧值，按 academic_general 执行；不自动附加领域章节要求

# section_type 是可选文体职责提示。以下旧章节值继续兼容，
# 仅在原文确属该章节或用户明确指定时使用，不触发领域模板。
section_roles:
  文章: 按原文意图展开观点、叙述或说明，保留作者语气
  邮件: 写清来意、已有背景和行动请求，保留礼貌程度与承诺
  报告: 写清已有判断、依据、范围和待处理事项
  说明: 按读者理解顺序解释已有概念、关系或步骤
  立项依据: 问题驱动，明确研究缺口
  研究内容: 说明研究动作、边界、步骤和验证口径
  研究基础: 按证据链写清已有结果与局限
  工作条件: 将资源逐项对位到研究任务
  风险应对: 说明风险、触发条件、影响和备选方案
  通用: 只按原文职责判断，不强行套用其他章节结构
  其他: 从原文判断职责；无须为未指定文体额外请求选择

quality_checks:
  diagnostic_layers: [词语层, 句法层, 段落层, 章节层]
  require_term_table: true
  require_invariant_audit: true
  require_protected_token_diff: true
  require_boundary_disposition_table: true
  require_source_comparison: true
