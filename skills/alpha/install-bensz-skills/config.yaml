# install-bensz-skills 配置文件

# 技能基本信息
skill_info:
  name: install-bensz-skills
  version: 0.6.1
  description: "当需要把本仓库 skills/alpha 下的生产 skills 安装到系统级（默认同时安装到 Codex: ~/.codex/skills 和 Claude Code: ~/.claude/skills），以便在任意项目/对话中可被发现与调用时使用。默认不安装 skills/beta；只有显式指定 beta 源目录时才处理 beta skill。使用 MD5 哈希进行版本控制，仅安装有更新的 skills；支持 --skill 指定单个或少量技能安装/更新、强制覆盖安装和指定单一目标安装。支持远程安装模式（--remote --check/--auto），远程源会缓存到本地并用浅 fetch 增量更新；配置子目录 skills_path 时优先 Git sparse checkout，且 --skill 会进一步只下载目标 skill 目录；GitHub 传输 reset/timeout 会自动重试，已有可用缓存时会复用 last-known-good 缓存完成本轮安装，缓存不可用时再重建或回退到完整浅克隆。"
  author: "Bensz Conan"
  category: 安装管理

# 已废弃的旧 skill 名称
# 安装时会自动从系统级 skills 目录清理这些目录，避免重命名后的旧名继续干扰触发。
legacy_skill_names:
  - "make_latex_model"
  - "transfer_old_latex_to_new"
  - "write-paper-sci"
  - "explain-figures"
  - "complete_example"
  - "get-review-theme"
  - "guide-updater"
  - "check-review-alignment"
  - "make-research-plan"
  - "systematic-literature-review"
  - "nsfc-roadmap"
  - "nsfc-schematic"
  - "write-skill-readme"

# 远程技能源配置
# 每个源代表一个可从中下载技能的 Git 仓库
remote_sources:
  - id: "general"
    name: "通用技能"
    url: "https://github.com/huangwb8/skills"
    branch: "main"
    skills_path: "skills/alpha"
    description: "通用技能，建议所有用户安装"
    recommended: true

  - id: "research"
    name: "科研技能"
    url: "https://github.com/huangwb8/ChineseResearchLaTeX"
    branch: "main"
    skills_path: "skills"
    description: "科研相关技能，建议有科研需要的用户安装"
    recommended: true

  - id: "anthropic-docs"
    name: "Anthropic 文档处理技能"
    url: "https://github.com/anthropics/skills"
    branch: "main"
    skills_path: "skills"
    description: "Anthropic 官方文档处理技能（docx、pdf、pptx、xlsx），用于处理 Office 文档"
    recommended: true
