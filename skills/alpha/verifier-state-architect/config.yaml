skill_info:
  name: verifier-state-architect
  version: 0.3.2
  description: 为 Agent Skill 设计并落地最小、可解释、AI 友好的 Verifier 与 State 组合
  author: Bensz Conan
  category: skill architecture

directories:
  workspace_subdir: verifier-state-architect
  default_output: docs/plans/{skill-name}-verifier-state-design.md
  formal_plan_root: docs/plans
  verification_report: output/verification-report.json

execution:
  default_mode: implement
  read_only_modes:
    - plan-only
    - review-only
  require_plan_before_changes: true
  require_human_plan_approval: false
  require_hosting_check: true
  require_execution_evidence: true

planning:
  allow_zero_components: true
  require_deletion_impact_test: true
  require_ai_deterministic_split: true
  require_kernel_mapping: true
  required_plan_sections:
    - conclusion
    - business-flow-and-risk-map
    - deletion-impact-test
    - verifier-matrix
    - state-matrix
    - ai-deterministic-boundary
    - kernel-integration
    - kernel-reuse-and-meta-extraction
    - implementation-order
    - acceptance-tests
    - uncertainty-and-fallback

safety:
  default_read_only: false
  require_authorized_source_root: true
  allow_kernel_changes: false
  allow_remote_writes: false
  never_modify_installed_skill: true
  redact_sensitive_data: true
