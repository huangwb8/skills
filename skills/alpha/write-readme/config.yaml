skill_info:
  name: write-readme
  version: 0.3.0
  description: "为任意 GitHub 项目生成中文 README.md 与英文 README_EN.md；默认设计完整 GitHub Hero，并按项目类型组织 Quick Start、示例、配置、限制、安全、贡献和许可证，基于仓库事实校验双语结构与链接。"
  author: Bensz Conan
  category: normal

output:
  chinese_filename: README.md
  english_filename: README_EN.md
  language_contract: aligned-structure

validation:
  checker: scripts/check_readme_pair.py
  check_relative_links: true
  check_heading_tree: true
  check_code_fences: true
  check_tokens: true

templates:
  general: references/templates/general.md
  library: references/templates/library.md
  cli_service: references/templates/cli-service.md
  web_app: references/templates/web-app.md
  data_ml: references/templates/data-ml.md
  agent_skill: references/templates/agent-skill.md

runtime:
  kernel:
    name: bensz-skill-kernel
    version: 1.0.0
  state_roots:
    - references/states
  initial_state: bensz.workspace.ready
  states:
    - bensz.write-readme.input-ready
    - bensz.write-readme.facts-collected
    - bensz.write-readme.bilingual-draft-ready
    - bensz.write-readme.delivery-ready
    - bensz.write-readme.reported
  verifiers:
    - id: bensz.document.readme-pair-alignment
      version: 1.0.0
      required: true
    - id: bensz.artifact.path-scope
      version: 1.0.0
      required: true
    - id: bensz.artifact.file-existence
      version: 1.0.0
      required: true
    - id: bensz.document.markdown-link-integrity
      version: 1.0.0
      required: true
    - id: bensz.security.secret-redaction
      version: 1.0.0
      required: true
    - id: bensz.evidence.provenance
      version: 1.0.0
      required: true
