skill_info:
  name: bensz-r-developer
  version: "0.2.0"
  description: "面向可复用 R 函数、稳定 API、类与 Package 的工程规范，与 R/Rmd 分析流程主责明确分离"
  author: "Bensz Conan"
  category: "R development"

defaults:
  class_system: auto
  overwrite: false
  persistence_when_null: false

class_selection:
  default_value_object: S3
  formal_contract_or_multiple_dispatch: S4
  mutable_resource_lifecycle: R6

parallel:
  preferred_ecosystem: future
  package_sets_global_plan: false
  default_worker_policy: reserve-one
  aggressive_requires_explicit_request: true
  reproducible_rng: true
  nested_parallelism: false

native_acceleration:
  profile_first: true
  preferred_bridges:
    - cpp11
    - Rcpp
  require_reference_implementation: true
  require_equivalence_tests: true

package_tooling:
  structure:
    - usethis
  documentation:
    - roxygen2
  development:
    - devtools
  testing:
    - testthat
  optional_quality:
    - styler
    - lintr
    - covr
