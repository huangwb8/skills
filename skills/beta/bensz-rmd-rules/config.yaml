# bensz-rmd-rules 配置文件
# R Markdown 开发规范与最佳实践
#
# 注意：
# - Rmd 的 YAML 头（含 author）以 `rmd_template.yaml_header` 为准（单一真相来源）。
#   为了便于“复制即用”，两个 Rmd 模板会保留 YAML header 的拷贝；
#   维护者修改本节后，应同步更新模板（用 `scripts/check_rmd_template_yaml.py` 校验）。
# - luckyBase 是本 skill 的硬前提：包加载统一通过 `luckyBase::Plus.library()` 完成。

skill_info:
  name: bensz-rmd-rules
  version: "0.26.0"
  description: "规划并实现可复现的 R/R Markdown 分析流水线：新项目按复杂度选择 simple 或 targets-first complex/pipeline，两种模式均由 renv 锁定环境并通过真实轻量测试；complex 以 _targets.R + R/ 为唯一计算编排，Rmd 只消费 targets 结果。已有项目按现状兼容维护，不自动迁移或补齐机制。前提：luckyBase 为唯一固定 Bensz 依赖"
  author: "Bensz Conan"
  category: "开发规范"

# R 包资源配置
# 固定依赖仅保留 luckyBase；其它包由项目声明并由 renv.lock 锁定。
r_packages:
  fixed:
    - name: luckyBase
      description: "Bensz 基础包：包加载、项目初始化与稳定通用辅助能力"
  project_managed:
    description: "具体分析所需的 CRAN、Bioconductor 或用户自有包；必须写入项目 renv.lock，不在 Skill 中预设"

# 项目状态与生命周期契约
project_strategy:
  state_detection:
    new_project: "空目录或用户明确声明新建"
    existing_project: "存在 R/Rmd、raw、products、reports、runner、_targets.R 或 renv/renv.lock"
    ambiguous: "只读盘点后请求澄清，不猜测迁移意图"
  new_project:
    require_renv: true
    default_workflow_mode: "simple"
    workflow_modes:
      - "simple"
      - "complex"
    complex_alias: "pipeline"
    pipeline_first: true
    human_override_precedence: true
    legacy_runner_fallback: false
  existing_project:
    workflow_mode: "preserved-existing"
    create_missing_targets: false
    create_missing_renv: false
    migrate_layout: false
    preserve_existing_runner: true

targets:
  entrypoint: "_targets.R"
  store_dir: "_targets"
  required_for_workflow_modes:
    - "complex"
  test_store_dir: "tmp/tests/{run_id}/_targets"
  output_contract: "targets 管理计算状态、依赖、失效与增量重建；products/ 与 reports/ 只保存需要审阅、复用或交付的科学产物"
  function_dir: "R"
  source_function_call: 'targets::tar_source("R")'
  report_consumer: "Rmd 通过 tar_read()/tar_load() 或受控 tarchetypes::tar_render() 消费 target"
  recovery_acceptance: "中断后再次 tar_make() 必须复用仍有效的前序 target"
  legacy_checkpoint_allowed: false

renv:
  lockfile: "renv.lock"
  activation: "renv/activate.R"
  required_for_new_project: true
  initialize_once: true
  silent_install_or_snapshot_during_run: false
  excluded_paths:
    - "renv/library"
    - "renv/staging"
    - "renv/cache"

# 新建或实质修改的分析流程都必须真实执行一种轻量测试。
lightweight_testing:
  required_for_new_or_materially_changed_flow: true
  styles:
    - "synthetic_fixture"
    - "project_subset"
  default_without_authorized_data: "synthetic_fixture"
  preferred_with_authorized_existing_data: "project_subset"
  entrypoint: "scripts/tests/smoke_test.R"
  source_dir: "scripts/tests"
  run_dir: "tmp/tests/{run_id}"
  path_overrides:
    input: "BENSZ_ANALYSIS_INPUT"
    products: "BENSZ_PRODUCTS_DIR"
    reports: "BENSZ_REPORTS_DIR"
    run_root_guard: "BENSZ_TEST_RUN_ROOT"
  require_same_formal_entrypoint: true
  forbid_business_logic_test_flags: true
  required_attempt_fields:
    - "command"
    - "exit_status"
    - "failure_category"
    - "fix_summary"
    - "assertions"
    - "remaining_risks"
  failure_categories:
    - "environment_dependency"
    - "fixture_or_subset"
    - "path_isolation"
    - "analysis_code"
    - "scientific_assertion"
    - "report_rendering"
    - "external_service"
  execution_statuses:
    - "preflight"
    - "lightweight_execution"
    - "full_data_execution"
  default_full_data_execution: "NOT_RUN"
  cleanup_project_subset_by_default: true

# Rmd 模板配置
rmd_template:
  yaml_header:
    title: "AA.BB.CC. 报告标题"
    author: "Bensz Conan"
    date: "`r Sys.Date()`"
    params:
      plot_language: "en"
      top_n: 3
      q_cutoff: 0.05
      min_sample_n: 30
      interpret_top_n: 3
      interpret_min_stratum_n: 30
      interpret_min_consistent_prop: 0.70
      interpret_min_boot_prop: 0.70
      # Plot delivery helpers (optional):
      # - plot_run_dir: current .bensz-api/task-* root; default reads BENSZ_TASK_ROOT
      # - plot_preview_dpi: raster preview DPI (higher => clearer but larger files)
      plot_run_dir: ~
      plot_preview_dpi: 200
    output:
      html_document:
        toc: true
        toc_float: true
        toc_depth: 3
        number_sections: true
        theme: default
        highlight: tango
        code_folding: show
        includes:
          after_body: "templates/liquid_glass_lightbox.html"
        css: "templates/liquid_glass_theme.css"
  # DT::datatable 标准化调用
  datatables_helper: "templates/datatables_helper.R"
# 注意：完整的 YAML 头配置说明、Liquid Glass 主题特性、自定义选项详见：
#   references/liquid_glass_theme_guide.md（说明文档；具体字段以本文件 rmd_template.yaml_header 为准）

# 图表语言配置
plot_language:
  # 默认语言：en（英文）或 zh（中文）
  default: "en"
  # 强制英文：图表轴标题、图例、标题等必须使用英文
  # 例外场景：中文期刊投稿可在 YAML params 中设置 plot_language: "zh"
  force_english: true

# 图表质量配置（默认即 Nature 级别）
plot_quality:
  default_level: "nature"
  supported_packages:
    - ggplot2
    - ComplexHeatmap
    - plotly
  allowed_levels:
    - nature

# 图表可读性硬检查阈值（经验默认值，可按项目需求调整）
# 用途：指导 AI 在生成绘图代码后“必须显式检查并修复”的常见问题。
plot_readability:
  # 轴刻度过密阈值（> max_ticks 时，优先减少 breaks 或采样显示）
  max_ticks: 20
  # 最小可接受字体（pt）；低于该值通常打印/投影不可读
  min_font_pt: 8
  # 分类标签过长的参考阈值（字符数）；超过后优先旋转/换行/缩写
  long_label_chars: 20
  # Heatmap 行/列名建议最大长度；超过后优先截断并保留前缀
  heatmap_max_label_chars: 15

# 文件结构配置（新项目默认；旧 tmp 项目非破坏兼容）
file_structure:
  function_dir: "R"
  pipeline_entrypoint: "_targets.R"
  report_script: "{report}.Rmd"
  rendered_report: "{report}.html"
  environment_script: "00.Environment.R"
  r_dir: "R"
  raw_dir: "raw"
  products_dir: "products"
  reports_dir: "reports"
  styles_dir: "templates"
  operations_dir: "scripts/operations"
  library_dir: "scripts/lib"
  tests_dir: "scripts/tests"
  test_runs_dir: "tmp/tests/{run_id}"
  scratch_dir: "tmp/scratch"
  legacy_temp_pattern: "tmp/{主脚本名}"

product_storage:
  default_dir: "products"
  environment_override: "BENSZ_PRODUCTS_DIR"
  require_single_project_setting: true
  stay_inside_project: true
  forbidden_roots:
    - "raw"
    - "reports"
    - "tmp"
    - "_targets"
    - ".bensz-api"

# 文件命名约定（pipeline 不要求编号脚本；existing 可保留旧命名）
naming_convention:
  target_name_pattern: '^[A-Za-z][A-Za-z0-9_.-]*$'
  report_name_pattern: '^[A-Za-z0-9_. -]+$'
  existing_unit_pattern: '^\d{2}\.\d{2}\.\d{2}\. .+$'

# 输出配置
output:
  html_skill: "knit-rmd-html"
  html_location: "project_root"
  figures_dir: "reports/figures"
  tables_dir: "reports/tables"
  supplementary_dir: "reports/supplementary"

# 多分析单元、缓存和恢复的稳定默认值
analysis_workflow:
  plan_file: "analysis-plan.yaml"
  default_workflow: "pipeline"
  product_path: "{products_dir}/<scientific-product>"
  contract_version: 2
  cache_identity: "targets metadata and store only; no SUCCESS/identity runner"
  report_dependency: "reports consume target values and must not read raw/ to repeat expensive computation"
  recovery:
    required: true
    command: "targets::tar_make()"
    evidence: ["tar_meta", "outdated target set", "execution log"]
  controls:
    force_rebuild: "targets::tar_make(callr_function = NULL) or explicit targets invalidation"
  validation:
    default_mode: "report"
    delivery_mode: "strict"
  serial_reviews:
    - "structure-dataflow"
    - "r-implementation-recovery"
    - "scientific-statistical"
  legacy_runner:
    status: "existing-project-only"
    new_project_fallback: false

observability:
  default: "targets"
  progress: ["targets::tar_poll", "targets::tar_watch"]
  worker_metrics: ["crew logging", "crew_options_metrics"]
  resource_diagnostics: ["autometric::log_start", "autometric::log_read", "autometric::log_plot"]
  policy: "Skill 只组合成熟组件，不定义新的事件字段、调度器、worker 状态机或 dashboard"

parallel:
  optional: true
  controller: "crew"
  enable_when: "存在足够多相互独立且昂贵的 target，收益覆盖 worker 启动与传输开销"
  default_workers: 1
  oversubscription_guard: "限制 worker 数与 BLAS/OpenMP/future/BiocParallel 内部线程数乘积不超过资源预算"
  random_seed: "在 target 图中显式声明可复现随机数策略"

# 指标解释协议：常用指标使用白名单；未命中、无法确定或非标准定义时按不常用指标处理。
metric_explanation:
  audience_assumption: "相关背景较弱，但需要获得专业、准确且可复核的解释"
  classification: "common_allowlist_else_uncommon"
  require_guide_table_for_uncommon: true
  require_full_first_mention: true
  concise_after_first_mention: true
  reset_when_definition_changes: true
  common_metrics:
    descriptive:
      - "样本量/频数/比例"
      - "均值/中位数/标准差/四分位距"
      - "发生率"
    inference:
      - "p 值"
      - "q 值/FDR"
      - "95% 置信区间"
    effect_and_association:
      - "均值差/回归系数"
      - "OR/RR/HR"
      - "Pearson r/Spearman rho"
    survival:
      - "Kaplan-Meier 生存概率/中位生存期"
      - "log-rank 检验"
      - "Cox HR"
      - "C-index"
    diagnostic_and_binary_prediction:
      - "ROC AUC"
      - "灵敏度/特异度"
      - "阳性预测值/阴性预测值"
      - "准确率"

# 图表/表格解读覆盖检验（硬编码静态检查）
# 目的：彻底解决“有图表/表格但缺少解读”的漏项。
figure_interpretation_check:
  enabled: true
  # 默认仅报告（不阻断），交付前请在 CLI 显式加 --strict 做“Fail Fast”门禁
  strict_mode: false
  required_layers: 4  # 期望四层解读框架（脚本主要做覆盖检查，层数作为口径）
  max_distance_lines: 50  # 允许解读距离图表/表格输出块的最大行距
  require_reference: false  # 是否强制要求显式引用“Figure/图/Table/表 N”（更严格但更易误杀）
  # 是否要求解读段落包含某些“解读/结论/观察”等标记词（默认 true；marker 更中性，不再强迫四层标签）
  # - 设为 false：仅做“有 prose + 最低长度/要素”门禁
  # - 设为 true 且 markers 为空：自动跳过 marker 检查（避免误杀）
  require_markers: true
  # 解读最小长度门槛（脚本默认值从此读取，CLI 仍可覆盖）
  min_cjk_chars: 80
  min_en_words: 40
  # 证据锚定要素数量（启发式 proxy，避免“空话解读”）
  min_content_elements: 2
  check_patterns:
    figure_generation:
      - "\\bggplot\\s*\\("
      - "\\bgeom_[a-zA-Z0-9_]+\\s*\\("
      - "\\bplot\\s*\\("
      - "\\bheatmap\\b"
      - "\\bComplexHeatmap\\b"
      - "\\bHeatmap\\s*\\("
      - "\\bpheatmap\\s*\\("
      - "\\bggsave\\s*\\("
      - "\\bpdf\\s*\\("
      - "\\bpng\\s*\\("
      - "\\btiff\\s*\\("
      - "\\bjpeg\\s*\\("
    table_generation:
      - "\\bknitr::kable\\s*\\("
      - "\\bkable\\s*\\("
      - "\\bDT::datatable\\s*\\("
      - "\\brender_dt_output\\s*\\("
      - "\\brender_dt\\s*\\("
      - "\\bgt::gt\\s*\\("
      - "\\bflextable::flextable\\s*\\("
      - "\\breactable::reactable\\s*\\("
    interpretation_markers:
      # 更中性的 marker：用于识别“这是在写解读/结论/观察”，而非强制四层标签写法
      - "解读"
      - "结论"
      - "小结"
      - "观察"
      - "核心结论"
      - "结果(?:显示|表明|提示|可见)"
      - "\\binterpretation\\b"
      - "\\btakeaway\\b"
      - "(?:图|表|Figure|Table)\\s*\\d+.*?(?:解读|分析|结果|interpretation|analysis)"

# 解读质量静态预检（启发式检查）
# 脚本：scripts/check_interpretation_quality.py
# 说明：脚本优先使用此配置；若未配置则使用脚本内置默认值（降级）
interpretation_quality_check:
  enabled: true
  min_inline_r: 3
  min_current_observation: 3
  # 推荐结构（默认不强迫；交付/收敛阶段可用 --strict 或改此配置启用）
  require_top_hits: false
  require_uncertainty_hits: false
  require_actionability: false

  # 数字可追溯：识别 prose 中“字面数字”但缺少附近 `r ...` 的情况（启发式）
  check_untracked_numbers: true
  max_untracked_numbers: 1
  # 允许的“字面数字”白名单（避免误杀：年份/图表编号等）
  untracked_number_exempt_patterns:
    - "\\b20\\d{2}\\b"
    - "(?:Figure|Table|图|表)\\s*\\d+"
  check_tone: true
  max_teaching_hits: 2
  check_title_style: false
  check_bold: false
  max_bold_per_1000: 10.0
  check_actionability: true
  max_actionability_issues: 2
  check_template_labels: true
  max_tier_label_lines: 8
  teaching_markers:
    - "提示："
    - "注意："
    - "需要注意的是"
    - "即："
    - "即:"
    - "用于快速识别"
    - "用于快速判断"
    - "帮助你判断"
    - "用于把方向落到"
  # 硬黑名单：命中即阻断交付（尽量少用；优先用“反模板/可证伪/可执行”检查替代）
  blacklist_patterns: []

  # 机械模板检测：命中即判定为“结构填空”，通常不看数据也能写出来
  check_mechanical_templates: true
  max_mechanical_template_hits: 0
  mechanical_template_patterns:
    - "这张(?:图|表|图/表).{0,20}?(?:在)?本次.{0,20}?直接观察是[:：].*?统计.{0,20}?含义是[:：].*?研究者.{0,20}?意义是[:：].*?(?:你可以)?(?:立即)?(?:执行)?的?下一步"

  # 空泛句式检测：这些短语不一定永远错误，但若附近缺少“对象+数值证据”，通常意味着在说官话
  check_vague_phrases: true
  vague_phrase_window_chars: 160
  max_vague_phrase_issues: 2
  vague_phrase_patterns:
    - "提示可能"
    - "可能提示"
    - "值得深入探讨"
    - "需要进一步研究"
    - "建议进一步研究"
    - "建议进一步验证"
    - "需要进一步验证"
    - "为.*提供依据"
