workflow: "pipeline"
project_state: "new"
inputs:
  - id: "analysis_input"
    path: "raw/input.tsv"
    role: "protected_input"
    identity: "记录来源/版本/schema/内容指纹；不记录敏感原始值或绝对私有路径"
    recovery: "由数据持有人保管；不可再生材料不能作为缓存删除"
execution:
  cwd: "project_root"
  environment: "R 版本、renv.lock 及影响结果的系统/外部资源版本"
  analysis_parameters: "显式配置依赖；分析 seed 在 _targets.R 声明"
  restore: 'Rscript --vanilla -e ''source("renv/activate.R"); renv::restore(prompt = FALSE)'''
  rebuild: 'Rscript --vanilla -e ''source("renv/activate.R"); targets::tar_make()'''
  # Replace report.Rmd with the actual report; DAG-external reports require
  # this command after rebuild. Confirm targets are current before render-only.
  render: 'Rscript --vanilla -e ''source("renv/activate.R"); rmarkdown::render("report.Rmd")'''
requirements:
  - id: "REQ-01"
    description: "说明用户目标或交付要求"
    targets: ["prepared_data", "analysis_results"]
targets:
  - name: "prepared_data"
    purpose: "从 raw 输入形成完整、可复用的分析数据"
    depends_on: ["analysis_input"]
    function: "R/analysis_functions.R::prepare_data"
    inputs: ["raw/input.tsv"]
    scientific_products: []
    completion: "target 成功且 schema/主键/缺失断言通过"
  - name: "analysis_results"
    purpose: "执行模型或统计计算，输出未按报告阈值截断的结果"
    depends_on: ["prepared_data"]
    function: "R/analysis_functions.R::analyze_data"
    inputs: ["prepared_data"]
    scientific_products: ["products/analysis_results.rds"]
    completion: "target 成功，关键数值与不变量断言通过"
# 可选：仅在关键结果涉及样本推断时填写；simple 可用等价短表或方法段，不需此文件。
inference:
  - parameter: "主要结局的组间均值差（示例，需替换）"
    estimand: "目标人群中 A 组减 B 组的均值差，单位同结局"
    design: "独立两组；确认抽样单位、缺失和组内相关后选方法"
    method: "按实际设计选择有效区间与检验；此处不预设 t/Wald 方法"
    confidence_level: 0.95 # 仅示例默认值；预注册方案另有规定时以方案为准
    null_hypothesis: "两组均值差为 0；若只做估计则填 not_applicable"
    test_sidedness: "预先声明单侧或双侧；不检验时填 not_applicable"
    multiplicity: "说明比较族、校正方法；无多重检验时填 not_applicable"
    not_estimable_when: "有效样本不足、设计/模型不支持有效推断时记录原因与替代分析"
    result_destination: "analysis_results 的完整结果及 Rmd 主要结果段"
reports:
  - path: "reports/"
    consumer: "Rmd 使用 targets::tar_read('analysis_results')"
    presentation_parameters: ["top_n", "q_cutoff", "plot_language"]
recovery:
  store: "_targets/"
  test_store: "tmp/tests/<run-id>/_targets/"
  acceptance: "中断后再次 tar_make() 跳过仍有效的前序 target"
rebuild_acceptance:
  comparison: "预先定义关键数值容差、列/主键/顺序与交付清单；不比 HTML/PDF 字节"
  scenarios:
    cold_rebuild: "NOT_RUN"
    missing_delivery: "NOT_RUN"
    input_content_change: "NOT_RUN"
    relocated_project: "NOT_RUN"
  evidence: "每项附命令/cwd、输入/源码/参数/环境身份、退出状态与实际断言"
observability:
  progress: ["targets::tar_poll", "targets::tar_watch"]
  optional_workers: "crew"
