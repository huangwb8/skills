# validate-md-ref 技能配置文件

# 技能基本信息
skill_info:
  name: validate-md-ref
  version: 0.4.0
  description: 验证 Markdown 文档中 URL 引用的可访问性
  author: "Bensz Conan"
  category: 文档质量

# URL 验证配置
validation:
  # 请求超时时间（秒）
  timeout: 10

  # 是否跟随重定向
  follow_redirects: true

  # 最大重定向次数
  max_redirects: 5

  # 用户代理字符串（避免被某些网站拒绝）
  user_agent: "Mozilla/5.0 (compatible; validate-md-ref/0.4.0)"

# 域名白名单（空列表表示不限制）
# 添加域名到白名单以只验证特定域名
# 示例: ["github.com", "stackoverflow.com", "docs.python.org"]
domain_whitelist: []

# 域名黑名单（这些域名的链接将被跳过）
# 示例: ["localhost", "127.0.0.1", "internal.company.com"]
domain_blacklist:
  - localhost
  - 127.0.0.1
  - 0.0.0.0
  - "*.local"
  - "*.internal"

# 输出配置
output:
  # 是否生成详细报告
  generate_report: true

  # 报告文件名模板
  report_filename: "validate-md-ref-report.md"

  # 是否备份原文件
  backup_original: true

  # 备份文件名模板（{timestamp} 会被替换为时间戳）
  backup_filename_template: "{original_name}.bak.{timestamp}"
