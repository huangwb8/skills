# validate-md-ref 技能配置文件

# 技能基本信息
skill_info:
  name: validate-md-ref
  version: 0.8.1
  description: 验证 Markdown 文档中链接的完整性与 URL 可访问性
  author: "Bensz Conan"
  category: 文档质量

# URL 验证配置
validation:
  # 请求超时时间（秒）
  timeout: 10

# 域名白名单（空列表表示不限制）
# 添加域名到白名单以只验证特定域名
# 示例: ["github.com", "stackoverflow.com", "docs.python.org"]
domain_whitelist: []

# 域名黑名单（这些域名的链接将被跳过）
# 示例: ["localhost", "127.0.0.1", "internal.company.com"]
domain_blacklist:
  - localhost
  - 127.0.0.1
  - 0.0.0.0
  - "*.local"
  - "*.internal"
