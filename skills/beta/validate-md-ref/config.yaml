# validate-md-ref 技能配置文件

# 技能基本信息
skill_info:
  name: validate-md-ref
  version: 0.13.2
  description: 验证 Markdown 文档中链接的完整性与 URL 可访问性
  author: "Bensz Conan"
  category: 文档质量

# URL 验证配置
validation:
  # 请求超时时间（秒）
  timeout: 10

# 域名白名单（空列表表示不限制）
# 添加域名到白名单以只验证特定域名
# 示例: ["github.com", "stackoverflow.com", "docs.python.org"]
domain_whitelist: []

# 域名黑名单（这些域名的链接将被跳过）
# 示例: ["localhost", "127.0.0.1", "internal.company.com"]
domain_blacklist:
  - localhost
  - 127.0.0.1
  - 0.0.0.0
  - "*.local"
  - "*.internal"

# Kernel runtime declaration.  The legacy state-machine.json remains readable
# for older installations, while new callers discover this single declaration.
runtime:
  kernel:
    name: bensz-skill-kernel
    version: 0.12.4
  state_roots: [references/states]
  initial_state: bensz.workspace.ready
  states:
    - bensz.validate-md-ref.input-ready
    - bensz.validate-md-ref.checking
    - bensz.validate-md-ref.reported
  verifiers:
    - id: bensz.document.markdown-link-integrity
      version: 1.0.0
      required: true
    - id: bensz.evidence.citation-truth-fit
      version: 1.0.0
      required: false
