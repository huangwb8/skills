verifier_id: markdown.references.v1
version: 1.0.0
mode: hybrid
capabilities:
  - markdown.reference_extraction
  - url.reachability
  - anchor.local
evidence_requirements:
  required:
    - markdown.snapshot
    - reference.results
rules:
  - id: url-reachability
    severity: required
prompts:
  - id: content-entailment
    status: unchecked
    reason: "URL 可达性不等于正文主张被来源支持"
uncertainty_policy:
  missing_required_evidence: unchecked
  provider_timeout: unchecked
gate_policy:
  required_failure: reject
  unresolved_semantics: manual_review
side_effects: none
